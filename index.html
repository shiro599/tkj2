
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Expo SMKN 3 Payakumbuh</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKn6AnyFBAVKIZW0hkdUl2rxRPKuEg_uE",
            authDomain: "projects-tkj.firebaseapp.com",
            databaseURL: "https://projects-tkj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "projects-tkj",
            storageBucket: "projects-tkj.appspot.com",
            messagingSenderId: "1068028451955",
            appId: "1:1068028451955:web:3b157a492ddcb062199e06",
            measurementId: "G-4Y9REYFPCN"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        function tampilkanPesan(id, pesan, warna) {
            const el = document.getElementById(id);
            el.textContent = pesan;
            el.className = `text-sm mt-2 text-${warna}-500`;
            setTimeout(() => el.textContent = '', 4000);
        }

        window.kirimData = function(peran) {
            if (peran === 'guru') {
                const nama = document.getElementById('namaGuru').value.trim();
                const mapel = document.getElementById('mapelGuru').value.trim();
                if (nama && mapel) {
                    push(ref(database, 'absensi/guru'), { nama, mapel })
                        .then(() => {
                            tampilkanPesan('pesanGuru', 'Data berhasil dikirim!', 'green');
                            document.getElementById('formGuru').reset();
                        })
                        .catch((error) => tampilkanPesan('pesanGuru', 'Gagal kirim: ' + error, 'red'));
                } else {
                    tampilkanPesan('pesanGuru', 'Isi semua data!', 'red');
                }
            } else {
                const nama = document.getElementById('namaSiswa').value.trim();
                const kelas = document.getElementById('kelasSiswa').value.trim();
                const asal = document.getElementById('asalSiswa').value.trim();
                if (nama && kelas && asal) {
                    push(ref(database, 'absensi/siswa'), { nama, kelas, asal })
                        .then(() => {
                            tampilkanPesan('pesanSiswa', 'Data berhasil dikirim!', 'green');
                            document.getElementById('formSiswa').reset();
                        })
                        .catch((error) => tampilkanPesan('pesanSiswa', 'Gagal kirim: ' + error, 'red'));
                } else {
                    tampilkanPesan('pesanSiswa', 'Isi semua data!', 'red');
                }
            }
        };

        window.bukaAdmin = function() {
            const sandi = prompt('Masukkan password admin:');
            if (sandi === 'KhZrzHUMK@BaJT6') {
                window.location.href = 'admin.html';
            } else {
                alert('Password salah!');
            }
        };

        window.pilihPeran = function(peran) {
            document.getElementById('pilihan').style.display = 'none';
            if (peran === 'guru') {
                document.getElementById('formGuru').style.display = 'flex';
            } else {
                document.getElementById('formSiswa').style.display = 'flex';
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen px-4">
    <div class="bg-gray-800 rounded-2xl shadow-xl p-8 w-full max-w-md text-center relative">
        <h1 class="text-2xl font-semibold mb-6">Selamat datang di Absensi Expo SMKN 3 Payakumbuh</h1>
        
        <div id="pilihan" class="flex flex-col gap-4">
            <button onclick="pilihPeran('guru')" class="bg-gray-700 hover:bg-gray-600 text-lg py-3 rounded-xl transition">Masuk sebagai Guru</button>
            <button onclick="pilihPeran('siswa')" class="bg-gray-700 hover:bg-gray-600 text-lg py-3 rounded-xl transition">Masuk sebagai Siswa</button>
        </div>

        <form id="formGuru" class="hidden flex flex-col gap-4 mt-6 text-left">
            <label for="namaGuru" class="text-sm font-medium">Nama Lengkap</label>
            <input type="text" id="namaGuru" class="p-3 rounded-xl text-black focus:outline-none focus:ring-2 focus:ring-gray-500">
            <label for="mapelGuru" class="text-sm font-medium">Mata Pelajaran</label>
            <input type="text" id="mapelGuru" class="p-3 rounded-xl text-black focus:outline-none focus:ring-2 focus:ring-gray-500">
            <button type="button" onclick="kirimData('guru')" class="bg-green-600 hover:bg-green-500 text-lg py-3 rounded-xl transition mt-4">Kirim</button>
            <div id="pesanGuru"></div>
        </form>

        <form id="formSiswa" class="hidden flex flex-col gap-4 mt-6 text-left">
            <label for="namaSiswa" class="text-sm font-medium">Nama Lengkap</label>
            <input type="text" id="namaSiswa" class="p-3 rounded-xl text-black focus:outline-none focus:ring-2 focus:ring-gray-500">
            <label for="kelasSiswa" class="text-sm font-medium">Kelas</label>
            <input type="text" id="kelasSiswa" class="p-3 rounded-xl text-black focus:outline-none focus:ring-2 focus:ring-gray-500">
            <label for="asalSiswa" class="text-sm font-medium">Asal Sekolah</label>
            <input type="text" id="asalSiswa" class="p-3 rounded-xl text-black focus:outline-none focus:ring-2 focus:ring-gray-500">
            <button type="button" onclick="kirimData('siswa')" class="bg-green-600 hover:bg-green-500 text-lg py-3 rounded-xl transition mt-4">Kirim</button>
            <div id="pesanSiswa"></div>
        </form>

        <button onclick="bukaAdmin()" class="fixed bottom-6 right-6 bg-gray-700 hover:bg-gray-600 p-4 rounded-full shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h16v16H4V4z" />
            </svg>
        </button>
    </div>
</body>
</html>
