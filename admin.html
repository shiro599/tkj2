
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <h1 class="text-3xl font-bold mb-6">Data Absensi</h1>
  <div id="output" class="bg-white p-4 rounded shadow"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCKn6AnyFBAVKIZW0hkdUl2rxRPKuEg_uE",
      authDomain: "projects-tkj.firebaseapp.com",
      databaseURL: "https://projects-tkj-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "projects-tkj",
      storageBucket: "projects-tkj.appspot.com",
      messagingSenderId: "1068028451955",
      appId: "1:1068028451955:web:3b157a492ddcb062199e06"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const output = document.getElementById("output");
    const isAdmin = localStorage.getItem("adminLogin") === "true";
    if (!isAdmin) {
      alert("Akses ditolak.");
      window.location.href = "index.html";
    }

    function tampilkanData(refPath, title) {
      db.ref(refPath).once("value", (snapshot) => {
        const data = snapshot.val();
        const html = Object.values(data || {}).map((d, i) => `
          <tr>
            <td class="border px-2 py-1">${i + 1}</td>
            <td class="border px-2 py-1">${d.nama}</td>
            <td class="border px-2 py-1">${d.instansi}</td>
            <td class="border px-2 py-1">${d.kelas}</td>
            <td class="border px-2 py-1">${d.waktu}</td>
          </tr>
        `).join("");
        output.innerHTML += `
          <h2 class="text-xl font-bold mt-6 mb-2">${title}</h2>
          <table class="w-full text-sm border border-gray-300">
            <thead>
              <tr class="bg-gray-200">
                <th class="border px-2 py-1">No</th>
                <th class="border px-2 py-1">Nama</th>
                <th class="border px-2 py-1">Instansi</th>
                <th class="border px-2 py-1">Kelas</th>
                <th class="border px-2 py-1">Waktu</th>
              </tr>
            </thead>
            <tbody>${html}</tbody>
          </table>
        `;
      });
    }

    tampilkanData("absensiMurid", "Absensi Murid");
    tampilkanData("absensiGuru", "Absensi Guru");
  </script>
</body>
</html>
