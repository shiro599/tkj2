
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Data Absensi Expo</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKn6AnyFBAVKIZW0hkdUl2rxRPKuEg_uE",
            authDomain: "projects-tkj.firebaseapp.com",
            databaseURL: "https://projects-tkj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "projects-tkj",
            storageBucket: "projects-tkj.appspot.com",
            messagingSenderId: "1068028451955",
            appId: "1:1068028451955:web:3b157a492ddcb062199e06",
            measurementId: "G-4Y9REYFPCN"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        function tampilkanData(path, tabelId) {
            const tabel = document.getElementById(tabelId);
            tabel.innerHTML = '';
            const refData = ref(database, path);
            onValue(refData, (snapshot) => {
                tabel.innerHTML = '';
                snapshot.forEach((child) => {
                    const data = child.val();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${data.nama}</td>
                        <td>${data.kelas || data.mapel}</td>
                        <td>${data.asal || '-'}</td>
                        <td><button onclick="hapusData('${path}', '${child.key}')" class="text-red-500">Hapus</button></td>`;
                    tabel.appendChild(tr);
                });
            });
        }

        window.hapusData = function(path, key) {
            if (confirm('Yakin hapus data ini?')) {
                remove(ref(database, `${path}/${key}`));
            }
        };

        window.onload = function() {
            tampilkanData('absensi/guru', 'tabelGuru');
            tampilkanData('absensi/siswa', 'tabelSiswa');
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <h1 class="text-2xl font-bold mb-6">Data Absensi Expo SMKN 3 Payakumbuh</h1>
    <h2 class="text-xl font-semibold mt-4 mb-2">Data Guru</h2>
    <table class="w-full text-left border-collapse mb-6">
        <thead><tr><th>Nama</th><th>Mata Pelajaran</th><th>-</th><th>Aksi</th></tr></thead>
        <tbody id="tabelGuru" class="divide-y divide-gray-700"></tbody>
    </table>

    <h2 class="text-xl font-semibold mt-4 mb-2">Data Siswa</h2>
    <table class="w-full text-left border-collapse">
        <thead><tr><th>Nama</th><th>Kelas</th><th>Asal</th><th>Aksi</th></tr></thead>
        <tbody id="tabelSiswa" class="divide-y divide-gray-700"></tbody>
    </table>
</body>
</html>
