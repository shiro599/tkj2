<!-- absensi-form.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold text-center mb-6">Form Absensi Murid</h1>

  <div class="w-full max-w-xl bg-white shadow-md border rounded-xl p-6">
    <form id="absenForm" class="space-y-4">
      <div>
        <label for="nama" class="block font-medium mb-1">Nama Lengkap</label>
        <input type="text" id="nama" required
          class="w-full border border-gray-300 rounded px-4 py-2" />
      </div>

      <div>
        <label for="sekolah" class="block font-medium mb-1">Asal Sekolah</label>
        <input type="text" id="sekolah" required
          class="w-full border border-gray-300 rounded px-4 py-2" />
      </div>

      <div>
        <label for="kelas" class="block font-medium mb-1">Kelas</label>
        <select id="kelas" required
          class="w-full border border-gray-300 rounded px-4 py-2">
          <option value="">Pilih Kelas</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
        </select>
      </div>

      <button type="submit"
        class="w-full bg-gray-800 text-white font-semibold py-2 rounded">Kirim Absensi</button>
    </form>
    <p class="text-green-600 mt-4 hidden" id="successMsg">Data berhasil dikirim!</p>
  </div>

  <script>
    const form = document.getElementById("absenForm");
    const success = document.getElementById("successMsg");
    let data = JSON.parse(localStorage.getItem("absensiData") || "[]");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const nama = document.getElementById("nama").value.trim();
      const sekolah = document.getElementById("sekolah").value.trim();
      const kelas = document.getElementById("kelas").value;

      if (nama && sekolah && kelas) {
        const entry = { nama, sekolah, kelas };
        data.push(entry);
        localStorage.setItem("absensiData", JSON.stringify(data));
        form.reset();
        success.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
