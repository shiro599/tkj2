<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Absensi Expo SMKN 3 Payakumbuh</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKn6AnyFBAVKIZW0hkdUl2rxRPKuEg_uE",
            authDomain: "projects-tkj.firebaseapp.com",
            databaseURL: "https://projects-tkj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "projects-tkj",
            storageBucket: "projects-tkj.appspot.com",
            messagingSenderId: "1068028451955",
            appId: "1:1068028451955:web:3b157a492ddcb062199e06",
            measurementId: "G-4Y9REYFPCN"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        function tampilkanData(refPath, tableId) {
            const table = document.getElementById(tableId);
            onValue(ref(database, refPath), (snapshot) => {
                table.innerHTML = '';
                snapshot.forEach((child) => {
                    const data = child.val();
                    const key = child.key;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-2 border-b">${data.nama || '-'}</td>
                        <td class="p-2 border-b">${data.kelas || data.mapel || '-'}</td>
                        <td class="p-2 border-b">${data.asal || '-'}</td>
                        <td class="p-2 border-b text-center">
                            <button onclick="hapusSatu('${refPath}', '${key}')" class="text-red-500 hover:text-red-700">
                                🗑
                            </button>
                        </td>`;
                    table.appendChild(row);
                });
            });
        }

        function hapusSemua(refPath) {
            if (confirm("Yakin ingin menghapus semua data?")) {
                remove(ref(database, refPath));
            }
        }

        window.hapusSatu = function(refPath, key) {
            remove(ref(database, ${refPath}/${key}));
        };

        window.onload = function() {
            const password = prompt("Masukkan kata sandi admin:");
            if (password !== "KhZrzHUMK@BaJT6") {
                alert("Sandi salah!");
                window.location.href = "index.html";
            } else {
                tampilkanData('absensi/guru', 'tabelGuru');
                tampilkanData('absensi/siswa', 'tabelSiswa');
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-start p-4">
    <h1 class="text-2xl font-bold mb-4">Admin - Absensi Expo SMKN 3 Payakumbuh</h1>

    <div class="w-full max-w-3xl bg-gray-800 rounded-2xl shadow-lg p-4 mb-6">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-xl font-semibold">Data Guru</h2>
            <button onclick="hapusSemua('absensi/guru')" class="bg-red-600 hover:bg-red-500 text-sm px-3 py-1 rounded">Hapus Semua</button>
        </div>
        <table class="w-full text-left text-sm">
            <thead>
                <tr>
                    <th class="p-2 border-b">Nama Lengkap</th>
                    <th class="p-2 border-b">Mata Pelajaran</th>
                    <th class="p-2 border-b">Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelGuru"></tbody>
        </table>
    </div>

    <div class="w-full max-w-3xl bg-gray-800 rounded-2xl shadow-lg p-4">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-xl font-semibold">Data Siswa</h2>
            <button onclick="hapusSemua('absensi/siswa')" class="bg-red-600 hover:bg-red-500 text-sm px-3 py-1 rounded">Hapus Semua</button>
        </div>
        <table class="w-full text-left text-sm">
            <thead>
                <tr>
                    <th class="p-2 border-b">Nama Lengkap</th>
                    <th class="p-2 border-b">Kelas</th>
                    <th class="p-2 border-b">Asal Sekolah</th>
                    <th class="p-2 border-b">Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelSiswa"></tbody>
        </table>
    </div>
</body>
</html>
