
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen flex flex-col items-center p-6">
  <h1 class="text-3xl font-bold text-center mb-6">Form Absensi Guru</h1>
  <div class="w-full max-w-xl bg-white shadow-md border rounded-xl p-6">
    <form id="absenGuruForm" class="space-y-4">
      <div>
        <label for="namaGuru" class="block font-medium mb-1">Nama Lengkap</label>
        <input type="text" id="namaGuru" required class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="mataPelajaran" class="block font-medium mb-1">Mata Pelajaran</label>
        <input type="text" id="mataPelajaran" required class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <button type="submit" class="w-full bg-gray-800 text-white font-semibold py-2 rounded hover:bg-gray-900 transition">Simpan Absensi</button>
    </form>
  </div>
  <div class="mt-10 w-full max-w-2xl">
    <h2 class="text-xl font-semibold mb-4 text-center">Data Absensi Guru</h2>
    <table class="w-full text-left border border-gray-200 rounded overflow-hidden">
      <thead class="bg-gray-100">
        <tr>
          <th class="py-2 px-4 border-b">No</th>
          <th class="py-2 px-4 border-b">Nama</th>
          <th class="py-2 px-4 border-b">Mata Pelajaran</th>
        </tr>
      </thead>
      <tbody id="tabelAbsensiGuru" class="bg-white"></tbody>
    </table>
  </div>
  <script>
    const formGuru = document.getElementById('absenGuruForm');
    const tabelGuru = document.getElementById('tabelAbsensiGuru');
    let noGuru = 1;
    formGuru.addEventListener('submit', function (e) {
      e.preventDefault();
      const nama = document.getElementById('namaGuru').value.trim();
      const mapel = document.getElementById('mataPelajaran').value.trim();
      if (!nama || !mapel) return;
      const row = document.createElement('tr');
      row.innerHTML = `<td class="py-2 px-4 border-b">${noGuru++}</td><td class="py-2 px-4 border-b">${nama}</td><td class="py-2 px-4 border-b">${mapel}</td>`;
      tabelGuru.appendChild(row);
      formGuru.reset();
    });
  </script>
</body>
</html>
