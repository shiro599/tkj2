<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Expo SMKN 3 Payakumbuh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .fade-slide {
      animation: fadeSlide 0.5s ease forwards;
    }
    .notif {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 1rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 100;
      background-color: #4ade80;
      color: white;
      transition: opacity 0.3s ease;
    }
    .notif.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center space-y-8">
  <h1 class="text-3xl font-bold">Selamat Datang di Absensi Expo SMKN 3 Payakumbuh</h1>

  <div class="flex space-x-4">
    <button onclick="showForm('guru')" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-xl shadow-lg">Masuk sebagai Guru</button>
    <button onclick="showForm('siswa')" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-xl shadow-lg">Masuk sebagai Siswa</button>
  </div>

  <form id="formGuru" class="hidden flex flex-col space-y-4 fade-slide w-80">
    <input type="text" id="namaGuru" placeholder="Nama Lengkap" class="p-2 rounded bg-gray-800">
    <input type="text" id="mapel" placeholder="Mata Pelajaran" class="p-2 rounded bg-gray-800">
    <button type="button" onclick="submitGuru()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-xl shadow-lg">Kirim</button>
  </form>

  <form id="formSiswa" class="hidden flex flex-col space-y-4 fade-slide w-80">
    <input type="text" id="namaSiswa" placeholder="Nama Lengkap" class="p-2 rounded bg-gray-800">
    <input type="text" id="kelas" placeholder="Kelas" class="p-2 rounded bg-gray-800">
    <input type="text" id="asalSekolah" placeholder="Asal Sekolah" class="p-2 rounded bg-gray-800">
    <button type="button" onclick="submitSiswa()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-xl shadow-lg">Kirim</button>
  </form>

  <div id="notif" class="notif hidden">Data berhasil dikirim!</div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://YOUR_FIREBASE_URL"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function showForm(type) {
      document.getElementById('formGuru').classList.add('hidden');
      document.getElementById('formSiswa').classList.add('hidden');
      if (type === 'guru') {
        document.getElementById('formGuru').classList.remove('hidden');
      } else {
        document.getElementById('formSiswa').classList.remove('hidden');
      }
    }

    function showNotif() {
      const notif = document.getElementById('notif');
      notif.classList.remove('hidden');
      setTimeout(() => notif.classList.add('hidden'), 3000);
    }

    function submitGuru() {
      const nama = document.getElementById('namaGuru').value;
      const mapel = document.getElementById('mapel').value;
      if (nama && mapel) {
        database.ref('guru').push({ nama, mapel });
        document.getElementById('formGuru').reset();
        showNotif();
      } else {
        alert('Lengkapi data!');
      }
    }

    function submitSiswa() {
      const nama = document.getElementById('namaSiswa').value;
      const kelas = document.getElementById('kelas').value;
      const asal = document.getElementById('asalSekolah').value;
      if (nama && kelas && asal) {
        database.ref('siswa').push({ nama, kelas, asal });
        document.getElementById('formSiswa').reset();
        showNotif();
      } else {
        alert('Lengkapi data!');
      }
    }
  </script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</body>
</html>
