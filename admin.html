<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Data Absensi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-6">

  <h1 class="text-3xl font-bold text-center mb-6">Data Absensi Expo SMKN 3 Payakumbuh</h1>

  <div class="max-w-5xl mx-auto space-y-10">

    <!-- Murid -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-4">Absensi Murid</h2>
      <table class="w-full border border-gray-200 text-sm md:text-base">
        <thead class="bg-gray-100">
          <tr>
            <th class="py-2 px-4 border-b">No</th>
            <th class="py-2 px-4 border-b">Nama</th>
            <th class="py-2 px-4 border-b">Sekolah</th>
            <th class="py-2 px-4 border-b">Kelas</th>
          </tr>
        </thead>
        <tbody id="tabelMurid"></tbody>
      </table>
    </div>

    <!-- Guru -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-4">Absensi Guru</h2>
      <table class="w-full border border-gray-200 text-sm md:text-base">
        <thead class="bg-gray-100">
          <tr>
            <th class="py-2 px-4 border-b">No</th>
            <th class="py-2 px-4 border-b">Nama</th>
            <th class="py-2 px-4 border-b">Instansi</th>
          </tr>
        </thead>
        <tbody id="tabelGuru"></tbody>
      </table>
    </div>

    <!-- Tombol Hapus -->
    <div class="text-center mt-6">
      <button onclick="hapusSemua()" class="bg-red-500 hover:bg-red-600 text-white py-2 px-6 rounded shadow">
        Hapus Semua Data
      </button>
    </div>
  </div>

  <script>
    const tabelMurid = document.getElementById("tabelMurid");
    const tabelGuru = document.getElementById("tabelGuru");

    const dataMurid = JSON.parse(localStorage.getItem("absensiMurid") || "[]");
    const dataGuru = JSON.parse(localStorage.getItem("absensiGuru") || "[]");

    if (dataMurid.length === 0) {
      tabelMurid.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-gray-500">Belum ada data murid.</td></tr>';
    } else {
      dataMurid.forEach((item, i) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="py-2 px-4 border-b text-center">${i + 1}</td>
          <td class="py-2 px-4 border-b">${item.nama}</td>
          <td class="py-2 px-4 border-b">${item.instansi}</td>
          <td class="py-2 px-4 border-b text-center">${item.kelas}</td>
        `;
        tabelMurid.appendChild(row);
      });
    }

    if (dataGuru.length === 0) {
      tabelGuru.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-gray-500">Belum ada data guru.</td></tr>';
    } else {
      dataGuru.forEach((item, i) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="py-2 px-4 border-b text-center">${i + 1}</td>
          <td class="py-2 px-4 border-b">${item.nama}</td>
          <td class="py-2 px-4 border-b">${item.instansi}</td>
        `;
        tabelGuru.appendChild(row);
      });
    }

    function hapusSemua() {
      if (confirm("Yakin ingin menghapus semua data?")) {
        localStorage.removeItem("absensiMurid");
        localStorage.removeItem("absensiGuru");
        location.reload();
      }
    }
  </script>
</body>
</html>
