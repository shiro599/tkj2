<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Absensi Expo SMKN 3 Payakumbuh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    .fade-slide { animation: fadeSlide 1s ease forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeSlide { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

  <!-- HEADER -->
  <div class="text-center p-6 fade-slide">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Data Absensi Admin</h1>
    <p class="text-gray-400">Expo SMKN 3 Payakumbuh</p>
  </div>

  <!-- DATA GURU -->
  <div class="p-4 fade-slide">
    <h2 class="text-2xl font-semibold mb-2">Data Guru</h2>
    <input type="text" id="searchGuru" placeholder="Cari Nama Guru..." class="mb-4 w-full px-4 py-2 rounded-lg bg-gray-700 text-white focus:outline-none">
    <button id="hapusGuru" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-xl shadow mb-4">Hapus Semua Data Guru</button>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-gray-800 rounded-2xl overflow-hidden shadow-xl">
        <thead class="bg-gray-700">
          <tr>
            <th class="py-3 px-4 text-left">No</th>
            <th class="py-3 px-4 text-left">Nama</th>
            <th class="py-3 px-4 text-left">Mapel</th>
            <th class="py-3 px-4 text-left">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelGuru"></tbody>
      </table>
    </div>
  </div>

  <!-- DATA SISWA -->
  <div class="p-4 fade-slide">
    <h2 class="text-2xl font-semibold mb-2">Data Siswa</h2>
    <input type="text" id="searchSiswa" placeholder="Cari Nama Siswa..." class="mb-4 w-full px-4 py-2 rounded-lg bg-gray-700 text-white focus:outline-none">
    <button id="hapusSiswa" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-xl shadow mb-4">Hapus Semua Data Siswa</button>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-gray-800 rounded-2xl overflow-hidden shadow-xl">
        <thead class="bg-gray-700">
          <tr>
            <th class="py-3 px-4 text-left">No</th>
            <th class="py-3 px-4 text-left">Nama</th>
            <th class="py-3 px-4 text-left">Kelas</th>
            <th class="py-3 px-4 text-left">Asal</th>
            <th class="py-3 px-4 text-left">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelSiswa"></tbody>
      </table>
    </div>
  </div>

  <!-- KEMBALI -->
  <div class="text-center mt-6 fade-slide">
    <a href="index.html" class="text-blue-400 hover:underline">Kembali ke Halaman Utama</a>
  </div>

  <script>
    // Konfigurasi Firebase - isi nanti dengan data kamu
    const firebaseConfig = {
      apiKey: "API_KEY_KAMU",
      authDomain: "PROJECT_ID.firebaseapp.com",
      databaseURL: "https://PROJECT_ID.firebaseio.com",
      projectId: "PROJECT_ID",
      storageBucket: "PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tabelGuru = document.getElementById('tabelGuru');
    const tabelSiswa = document.getElementById('tabelSiswa');

    const searchGuru = document.getElementById('searchGuru');
    const searchSiswa = document.getElementById('searchSiswa');

    function loadGuru(filter = "") {
      tabelGuru.innerHTML = '';
      let no = 1;
      db.ref('guru').once('value', snapshot => {
        snapshot.forEach(child => {
          const data = child.val();
          if (data.nama.toLowerCase().includes(filter.toLowerCase())) {
            const row = `
              <tr class="border-b border-gray-700">
                <td class="py-2 px-4">${no++}</td>
                <td class="py-2 px-4">${data.nama}</td>
                <td class="py-2 px-4">${data.mapel}</td>
                <td class="py-2 px-4">
                  <button onclick="hapusGuru('${child.key}')" class="bg-red-500 hover:bg-red-600 py-1 px-3 rounded shadow">Hapus</button>
                </td>
              </tr>`;
            tabelGuru.innerHTML += row;
          }
        });
      });
    }

    function loadSiswa(filter = "") {
      tabelSiswa.innerHTML = '';
      let no = 1;
      db.ref('siswa').once('value', snapshot => {
        snapshot.forEach(child => {
          const data = child.val();
          if (data.nama.toLowerCase().includes(filter.toLowerCase())) {
            const row = `
              <tr class="border-b border-gray-700">
                <td class="py-2 px-4">${no++}</td>
                <td class="py-2 px-4">${data.nama}</td>
                <td class="py-2 px-4">${data.kelas}</td>
                <td class="py-2 px-4">${data.asal}</td>
                <td class="py-2 px-4">
                  <button onclick="hapusSiswa('${child.key}')" class="bg-red-500 hover:bg-red-600 py-1 px-3 rounded shadow">Hapus</button>
                </td>
              </tr>`;
            tabelSiswa.innerHTML += row;
          }
        });
      });
    }

    function hapusGuru(id) {
      if (confirm('Yakin hapus data guru ini?')) {
        db.ref('guru/' + id).remove();
        loadGuru(searchGuru.value);
      }
    }

    function hapusSiswa(id) {
      if (confirm('Yakin hapus data siswa ini?')) {
        db.ref('siswa/' + id).remove();
        loadSiswa(searchSiswa.value);
      }
    }

    document.getElementById('hapusGuru').addEventListener('click', () => {
      if (confirm('Yakin hapus semua data guru?')) {
        db.ref('guru').remove();
        loadGuru();
      }
    });

    document.getElementById('hapusSiswa').addEventListener('click', () => {
      if (confirm('Yakin hapus semua data siswa?')) {
        db.ref('siswa').remove();
        loadSiswa();
      }
    });

    searchGuru.addEventListener('input', () => loadGuru(searchGuru.value));
    searchSiswa.addEventListener('input', () => loadSiswa(searchSiswa.value));

    loadGuru();
    loadSiswa();
  </script>
</body>
</html>
